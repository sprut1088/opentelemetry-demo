global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          app: "otel-collector"

  - job_name: "frontend-proxy"
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["frontend-proxy:10000"]
        labels:
          app: "frontend-proxy"
